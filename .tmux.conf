# split panes uing | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

set -g prefix C-s

set -g mouse on

set -g set-titles off
set -g set-titles-string " "

set-option -g allow-rename off
set-option -g automatic-rename off

set-option -g history-limit 10000

# Vim motions in copy/scroll mode
setw -g mode-keys vi

# Selection (copy-mode-vi)
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line

# Yank
set -s copy-command 'pbcopy'
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel 'pbcopy'


set-option -g status-position bottom

set -g pane-border-status off


bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# reolad config file
bind r source-file ~/.tmux.conf

bind-key R command-prompt -I "#W" "rename-window '%%'"



set -g @plugin 'tmux-plugins/tpm'
set -g default-terminal "tmux-256color"



# tmux-yank
# set -g @plugin 'tmux-plugins/tmux-yank'


# tmux-continuum
# set -g @plugin 'tmux-plugins/tmux-resurrect'
# set -g @plugin 'tmux-plugins/tmux-continuum'
#
# set -g @continuum-restore 'on'

# tmux-cpu
set -g @plugin 'tmux-plugins/tmux-cpu'
# set -g status-right '#{cpu_bg_color} CPU: #{cpu_icon} #{cpu_percentage} | %a %h-%d %H:%M '

# tmux-catpuccin
set -g @plugin 'catpuccin/tmux#v2.1.3'

# Configure the catppuccin plugin
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"

# Force catpuccin to use tmux window name:
set -g @catpuccin_window_default_text '#W'

# Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100
# set -g status-left "#[fg=colour250,bg=colour234] #I:#W #[default]"
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
set -agF status-right "#{E:@catppuccin_status_battery}"

# TPM - MUST HAVE!
run ~/.tmux/plugins/tpm/tpm


# Override catppuccin window text to use tmux window name
set -g window-status-format "#[fg=#11111b,bg=#{@thm_overlay_2}]#[fg=#181825,reverse]#[none]#I#[fg=#cdd6f4,bg=#{@thm_surface_0}] #W#[fg=#181825,reverse]#[none]"
set -g window-status-current-format "#[fg=#11111b,bg=#{@thm_mauve}]#[fg=#181825,reverse]#[none]#I #[fg=#cdd6f4,bg=#{@thm_surface_1}] #W#[fg=#181825,reverse]#[none]"

